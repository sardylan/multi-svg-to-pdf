[package]
name = "multi-svg-to-pdf"
version = "1.0.0"
edition = "2024"
description = "Render one PDF per data row from an SVG template with placeholders."
license = "GPL-3.0-or-later"
publish = false

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env", "color", "wrap_help"] }
csv = "1.4.0"
lopdf = "0.47.0"
png = "0.17"
rayon = "1.12.0"
resvg = "0.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
svg2pdf = "0.13.0"
time = { version = "0.3.55", features = ["macros", "formatting"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["time", "fmt", "ansi"] }
